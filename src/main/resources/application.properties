spring.application.name=moeda-estudantil

# Banco H2 em arquivo (desenvolvimento) - persistencia na pasta dados/
spring.datasource.url=jdbc:h2:file:./dados/moeda-estudantil
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ORM: Hibernate gera/atualiza o schema a partir das entidades JPA
spring.jpa.hibernate.ddl-auto=update

# Console do H2 em /h2-console (para demonstrar a camada de persistencia)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false

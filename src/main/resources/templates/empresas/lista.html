<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Empresas parceiras — Moeda Estudantil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav th:replace="~{fragmentos :: navbar}"></nav>
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1>Empresas parceiras</h1>
      <a href="/empresas/novo" class="btn btn-success">+ Nova empresa</a>
    </div>

    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>

    <p th:if="${#lists.isEmpty(empresas)}" class="text-muted">Nenhuma empresa cadastrada ainda.</p>

    <table th:unless="${#lists.isEmpty(empresas)}" class="table table-striped align-middle">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Email</th>
          <th>CNPJ</th>
          <th>Vantagens cadastradas</th>
          <th class="text-end">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="e : ${empresas}">
          <td th:text="${e.nome}"></td>
          <td th:text="${e.email}"></td>
          <td th:text="${e.cnpj}"></td>
          <td th:text="${#lists.size(e.vantagens)}"></td>
          <td class="text-end">
            <a th:href="@{/empresas/{id}/editar(id=${e.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
            <form th:action="@{/empresas/{id}/excluir(id=${e.id})}" method="post" class="d-inline"
                  onsubmit="return confirm('Excluir esta empresa?');">
              <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>

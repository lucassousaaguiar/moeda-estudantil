<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de empresa — Moeda Estudantil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav th:replace="~{fragmentos :: navbar}"></nav>
  <div class="container" style="max-width: 720px;">
    <h1 th:text="${empresa.id == null} ? 'Nova empresa parceira' : 'Editar empresa parceira'">Nova empresa parceira</h1>

    <div th:if="${erroGeral}" class="alert alert-danger" th:text="${erroGeral}"></div>

    <form th:action="@{/empresas}" th:object="${empresa}" method="post" class="row g-3">
      <input type="hidden" th:field="*{id}">

      <div class="col-md-6">
        <label class="form-label">Nome da empresa</label>
        <input type="text" class="form-control" th:field="*{nome}">
        <small class="text-danger" th:errors="*{nome}"></small>
      </div>
      <div class="col-md-6">
        <label class="form-label">CNPJ</label>
        <input type="text" class="form-control" th:field="*{cnpj}" placeholder="00.000.000/0000-00">
        <small class="text-danger" th:errors="*{cnpj}"></small>
      </div>
      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" th:field="*{email}">
        <small class="text-danger" th:errors="*{email}"></small>
      </div>
      <div class="col-md-6">
        <label class="form-label">Login</label>
        <input type="text" class="form-control" th:field="*{login}">
        <small class="text-danger" th:errors="*{login}"></small>
      </div>
      <div class="col-md-6">
        <label class="form-label" th:text="${empresa.id == null} ? 'Senha' : 'Senha (deixe em branco para manter)'">Senha</label>
        <input type="password" class="form-control" th:field="*{senha}">
        <small class="text-danger" th:errors="*{senha}"></small>
      </div>

      <div class="col-12">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="/empresas" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</body>
</html>

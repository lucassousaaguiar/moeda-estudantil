<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Alunos — Moeda Estudantil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav th:replace="~{fragmentos :: navbar}"></nav>
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1>Alunos</h1>
      <a href="/alunos/novo" class="btn btn-success">+ Novo aluno</a>
    </div>

    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>

    <p th:if="${#lists.isEmpty(alunos)}" class="text-muted">Nenhum aluno cadastrado ainda.</p>

    <table th:unless="${#lists.isEmpty(alunos)}" class="table table-striped align-middle">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Email</th>
          <th>CPF</th>
          <th>Instituição</th>
          <th>Curso</th>
          <th>Saldo</th>
          <th class="text-end">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="a : ${alunos}">
          <td th:text="${a.nome}"></td>
          <td th:text="${a.email}"></td>
          <td th:text="${a.cpf}"></td>
          <td th:text="${a.instituicao.nome}"></td>
          <td th:text="${a.curso}"></td>
          <td th:text="${a.conta.saldo} + ' 🪙'"></td>
          <td class="text-end">
            <a th:href="@{/alunos/{id}/editar(id=${a.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
            <form th:action="@{/alunos/{id}/excluir(id=${a.id})}" method="post" class="d-inline"
                  onsubmit="return confirm('Excluir este aluno?');">
              <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>

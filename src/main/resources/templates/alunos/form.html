<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de aluno — Moeda Estudantil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav th:replace="~{fragmentos :: navbar}"></nav>
  <div class="container" style="max-width: 720px;">
    <h1 th:text="${aluno.id == null} ? 'Novo aluno' : 'Editar aluno'">Novo aluno</h1>

    <div th:if="${erroGeral}" class="alert alert-danger" th:text="${erroGeral}"></div>

    <form th:action="@{/alunos}" th:object="${aluno}" method="post" class="row g-3">
      <input type="hidden" th:field="*{id}">

      <div class="col-md-6">
        <label class="form-label">Nome</label>
        <input type="text" class="form-control" th:field="*{nome}">
        <small class="text-danger" th:errors="*{nome}"></small>
      </div>
      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" th:field="*{email}">
        <small class="text-danger" th:errors="*{email}"></small>
      </div>
      <div class="col-md-6">
        <label class="form-label">CPF</label>
        <input type="text" class="form-control" th:field="*{cpf}" placeholder="000.000.000-00">
        <small class="text-danger" th:errors="*{cpf}"></small>
      </div>
      <div class="col-md-6">
        <label class="form-label">RG</label>
        <input type="text" class="form-control" th:field="*{rg}">
        <small class="text-danger" th:errors="*{rg}"></small>
      </div>
      <div class="col-12">
        <label class="form-label">Endereço</label>
        <input type="text" class="form-control" th:field="*{endereco}">
        <small class="text-danger" th:errors="*{endereco}"></small>
      </div>
      <div class="col-md-6">
        <label class="form-label">Instituição de ensino</label>
        <select name="instituicaoId" class="form-select" required>
          <option value="">Selecione...</option>
          <option th:each="i : ${instituicoes}" th:value="${i.id}" th:text="${i.nome}"
                  th:selected="${(aluno.instituicao != null and aluno.instituicao.id == i.id)
                                 or (instituicaoSelecionada != null and instituicaoSelecionada == i.id)}"></option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Curso</label>
        <input type="text" class="form-control" th:field="*{curso}">
        <small class="text-danger" th:errors="*{curso}"></small>
      </div>
      <div class="col-md-6">
        <label class="form-label">Login</label>
        <input type="text" class="form-control" th:field="*{login}">
        <small class="text-danger" th:errors="*{login}"></small>
      </div>
      <div class="col-md-6">
        <label class="form-label" th:text="${aluno.id == null} ? 'Senha' : 'Senha (deixe em branco para manter)'">Senha</label>
        <input type="password" class="form-control" th:field="*{senha}">
        <small class="text-danger" th:errors="*{senha}"></small>
      </div>

      <div class="col-12">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="/alunos" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</body>
</html>

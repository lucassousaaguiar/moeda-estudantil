<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="840" viewBox="0 0 1080 840" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tri" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto">
      <path d="M1,1 L14,7 L1,13 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    </marker>
    <marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#000000" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="840" fill="#ffffff"/>
  <text x="540" y="828" text-anchor="middle" font-size="10.5" fill="#555555">Diagrama de Casos de Uso v1 — Sistema de Moeda Estudantil (Lab03S01)</text>

  <!-- ===== Fronteira do sistema ===== -->
  <rect x="350" y="15" width="580" height="770" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="640" y="42" text-anchor="middle" font-size="13" font-weight="bold">Sistema de Moeda Estudantil</text>

  <!-- ===== Ator pai: Usuário ===== -->
  <g stroke="#000000" stroke-width="1.6" fill="none">
    <circle cx="120" cy="45" r="9" fill="#ffffff"/>
    <line x1="120" y1="54" x2="120" y2="83"/>
    <line x1="105" y1="64" x2="135" y2="64"/>
    <line x1="120" y1="83" x2="107" y2="103"/>
    <line x1="120" y1="83" x2="133" y2="103"/>
  </g>
  <text x="120" y="119" text-anchor="middle" font-size="11.5" font-weight="bold">Usuário</text>
  <text x="120" y="131" text-anchor="middle" font-size="7.8" fill="#333333">possui login e senha</text>

  <!-- ===== Generalização ===== -->
  <g stroke="#000000" stroke-width="1.2" fill="none">
    <line x1="120" y1="488" x2="120" y2="140" marker-end="url(#tri)"/>
    <line x1="120" y1="203" x2="174" y2="203"/>
    <line x1="120" y1="348" x2="174" y2="348"/>
    <line x1="120" y1="488" x2="174" y2="488"/>
  </g>

  <!-- ===== Ator: Aluno ===== -->
  <g stroke="#000000" stroke-width="1.5" fill="none">
    <circle cx="190" cy="185" r="8" fill="#ffffff"/>
    <line x1="190" y1="193" x2="190" y2="219"/>
    <line x1="177" y1="202" x2="203" y2="202"/>
    <line x1="190" y1="219" x2="179" y2="237"/>
    <line x1="190" y1="219" x2="201" y2="237"/>
  </g>
  <text x="190" y="253" text-anchor="middle" font-size="10" font-weight="bold">Aluno</text>
  <text x="190" y="265" text-anchor="middle" font-size="7.8" fill="#333333">recebe moedas e as troca</text>
  <text x="190" y="275" text-anchor="middle" font-size="7.8" fill="#333333">por vantagens</text>

  <!-- ===== Ator: Professor ===== -->
  <g stroke="#000000" stroke-width="1.5" fill="none">
    <circle cx="190" cy="330" r="8" fill="#ffffff"/>
    <line x1="190" y1="338" x2="190" y2="364"/>
    <line x1="177" y1="347" x2="203" y2="347"/>
    <line x1="190" y1="364" x2="179" y2="382"/>
    <line x1="190" y1="364" x2="201" y2="382"/>
  </g>
  <text x="190" y="398" text-anchor="middle" font-size="10" font-weight="bold">Professor</text>
  <text x="190" y="410" text-anchor="middle" font-size="7.8" fill="#333333">distribui moedas aos alunos</text>
  <text x="190" y="420" text-anchor="middle" font-size="7.8" fill="#333333">com motivo obrigatório</text>

  <!-- ===== Ator: Empresa Parceira ===== -->
  <g stroke="#000000" stroke-width="1.5" fill="none">
    <circle cx="190" cy="470" r="8" fill="#ffffff"/>
    <line x1="190" y1="478" x2="190" y2="504"/>
    <line x1="177" y1="487" x2="203" y2="487"/>
    <line x1="190" y1="504" x2="179" y2="522"/>
    <line x1="190" y1="504" x2="201" y2="522"/>
  </g>
  <text x="190" y="538" text-anchor="middle" font-size="10" font-weight="bold">Empresa Parceira</text>
  <text x="190" y="550" text-anchor="middle" font-size="7.8" fill="#333333">cadastra vantagens e</text>
  <text x="190" y="560" text-anchor="middle" font-size="7.8" fill="#333333">confere os resgates</text>

  <!-- ===== Ator externo: Sistema de Email ===== -->
  <g stroke="#000000" stroke-width="1.5" fill="none">
    <circle cx="1000" cy="300" r="8" fill="#ffffff"/>
    <line x1="1000" y1="308" x2="1000" y2="334"/>
    <line x1="987" y1="317" x2="1013" y2="317"/>
    <line x1="1000" y1="334" x2="989" y2="352"/>
    <line x1="1000" y1="334" x2="1011" y2="352"/>
  </g>
  <text x="1000" y="368" text-anchor="middle" font-size="9" font-style="italic">«sistema externo»</text>
  <text x="1000" y="382" text-anchor="middle" font-size="10" font-weight="bold">Servidor de Email</text>

  <!-- ===== Ator externo: Tempo (semestre) ===== -->
  <g stroke="#000000" stroke-width="1.5" fill="none">
    <circle cx="1000" cy="620" r="8" fill="#ffffff"/>
    <line x1="1000" y1="628" x2="1000" y2="654"/>
    <line x1="987" y1="637" x2="1013" y2="637"/>
    <line x1="1000" y1="654" x2="989" y2="672"/>
    <line x1="1000" y1="654" x2="1011" y2="672"/>
  </g>
  <text x="1000" y="688" text-anchor="middle" font-size="9" font-style="italic">«tempo»</text>
  <text x="1000" y="702" text-anchor="middle" font-size="10" font-weight="bold">Virada de semestre</text>

  <!-- ===== Casos de uso ===== -->
  <g fill="#ffffff" stroke="#000000" stroke-width="1.3">
    <ellipse cx="505" cy="70" rx="105" ry="27"/>
    <ellipse cx="505" cy="150" rx="105" ry="30"/>
    <ellipse cx="505" cy="230" rx="105" ry="27"/>
    <ellipse cx="505" cy="305" rx="105" ry="27"/>
    <ellipse cx="505" cy="380" rx="105" ry="27"/>
    <ellipse cx="505" cy="455" rx="105" ry="27"/>
    <ellipse cx="505" cy="535" rx="105" ry="30"/>
    <ellipse cx="505" cy="615" rx="105" ry="27"/>
    <ellipse cx="800" cy="340" rx="100" ry="30"/>
    <ellipse cx="800" cy="620" rx="100" ry="30"/>
  </g>
  <text x="505" y="66" text-anchor="middle" font-size="10" font-weight="bold">UC01</text>
  <text x="505" y="80" text-anchor="middle" font-size="10">Efetuar login</text>
  <text x="505" y="140" text-anchor="middle" font-size="10" font-weight="bold">UC02</text>
  <text x="505" y="154" text-anchor="middle" font-size="10">Cadastrar-se</text>
  <text x="505" y="167" text-anchor="middle" font-size="10">como aluno</text>
  <text x="505" y="226" text-anchor="middle" font-size="10" font-weight="bold">UC03</text>
  <text x="505" y="240" text-anchor="middle" font-size="10">Consultar vantagens</text>
  <text x="505" y="301" text-anchor="middle" font-size="10" font-weight="bold">UC04</text>
  <text x="505" y="315" text-anchor="middle" font-size="10">Resgatar vantagem</text>
  <text x="505" y="376" text-anchor="middle" font-size="10" font-weight="bold">UC05</text>
  <text x="505" y="390" text-anchor="middle" font-size="10">Consultar extrato</text>
  <text x="505" y="451" text-anchor="middle" font-size="10" font-weight="bold">UC06</text>
  <text x="505" y="465" text-anchor="middle" font-size="10">Enviar moedas</text>
  <text x="505" y="525" text-anchor="middle" font-size="10" font-weight="bold">UC07</text>
  <text x="505" y="539" text-anchor="middle" font-size="10">Cadastrar-se como</text>
  <text x="505" y="552" text-anchor="middle" font-size="10">empresa parceira</text>
  <text x="505" y="611" text-anchor="middle" font-size="10" font-weight="bold">UC08</text>
  <text x="505" y="625" text-anchor="middle" font-size="10">Manter vantagens</text>
  <text x="800" y="330" text-anchor="middle" font-size="10" font-weight="bold">UC09</text>
  <text x="800" y="344" text-anchor="middle" font-size="10">Notificar por email</text>
  <text x="800" y="357" text-anchor="middle" font-size="10">(com código gerado)</text>
  <text x="800" y="610" text-anchor="middle" font-size="10" font-weight="bold">UC10</text>
  <text x="800" y="624" text-anchor="middle" font-size="10">Creditar 1.000 moedas</text>
  <text x="800" y="637" text-anchor="middle" font-size="10">semestrais (acumulável)</text>

  <!-- ===== Associações ===== -->
  <g fill="none" stroke="#000000" stroke-width="1.1">
    <line x1="140" y1="60" x2="400" y2="68"/>
    <line x1="206" y1="205" x2="400" y2="152"/>
    <line x1="206" y1="213" x2="400" y2="228"/>
    <line x1="206" y1="221" x2="400" y2="302"/>
    <line x1="206" y1="229" x2="400" y2="375"/>
    <line x1="206" y1="350" x2="400" y2="383"/>
    <line x1="206" y1="358" x2="400" y2="452"/>
    <line x1="206" y1="490" x2="400" y2="532"/>
    <line x1="206" y1="498" x2="400" y2="610"/>
    <line x1="900" y1="337" x2="986" y2="320"/>
    <line x1="900" y1="620" x2="986" y2="635"/>
  </g>

  <!-- ===== include ===== -->
  <g fill="none" stroke="#000000" stroke-width="1.1" stroke-dasharray="6 4">
    <line x1="608" y1="312" x2="700" y2="334" marker-end="url(#open)"/>
    <line x1="608" y1="448" x2="700" y2="358" marker-end="url(#open)"/>
  </g>
  <text x="652" y="314" text-anchor="middle" font-size="9.5" font-style="italic">«include»</text>
  <text x="658" y="413" text-anchor="middle" font-size="9.5" font-style="italic">«include»</text>
</svg>

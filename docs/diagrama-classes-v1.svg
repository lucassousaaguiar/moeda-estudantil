<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="860" viewBox="0 0 1300 860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tri" markerWidth="18" markerHeight="16" refX="16" refY="8" orient="auto">
      <path d="M1,1 L16,8 L1,15 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    </marker>
    <marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#000000" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="860" fill="#ffffff"/>
  <text x="650" y="848" text-anchor="middle" font-size="11" fill="#555555">Diagrama de Classes v1 (modelo de domínio) — Sistema de Moeda Estudantil (Lab03S01)</text>

  <!-- ============ Usuario (abstrata) ============ -->
  <g>
    <rect x="300" y="30" width="210" height="112" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="300" y1="54" x2="510" y2="54" stroke="#000000" stroke-width="1"/>
    <line x1="300" y1="116" x2="510" y2="116" stroke="#000000" stroke-width="1"/>
    <text x="405" y="47" text-anchor="middle" font-size="11" font-weight="bold" font-style="italic">Usuario</text>
    <text x="308" y="68" font-size="9.5">- nome: String</text>
    <text x="308" y="82" font-size="9.5">- email: String</text>
    <text x="308" y="96" font-size="9.5">- login: String</text>
    <text x="308" y="110" font-size="9.5">- senhaHash: String</text>
    <text x="308" y="132" font-size="9.5">+ autenticar(senha: String): boolean</text>
  </g>

  <!-- Generalização -->
  <g stroke="#000000" stroke-width="1.2" fill="none">
    <line x1="405" y1="195" x2="405" y2="146" marker-end="url(#tri)"/>
    <line x1="155" y1="195" x2="670" y2="195"/>
    <line x1="155" y1="195" x2="155" y2="225"/>
    <line x1="415" y1="195" x2="415" y2="225"/>
    <line x1="670" y1="195" x2="670" y2="225"/>
  </g>

  <!-- ============ Aluno ============ -->
  <g>
    <rect x="40" y="225" width="230" height="124" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="40" y1="249" x2="270" y2="249" stroke="#000000" stroke-width="1"/>
    <line x1="40" y1="313" x2="270" y2="313" stroke="#000000" stroke-width="1"/>
    <text x="155" y="242" text-anchor="middle" font-size="11" font-weight="bold">Aluno</text>
    <text x="48" y="263" font-size="9.5">- cpf: String</text>
    <text x="48" y="277" font-size="9.5">- rg: String</text>
    <text x="48" y="291" font-size="9.5">- endereco: String</text>
    <text x="48" y="305" font-size="9.5">- curso: String</text>
    <text x="48" y="327" font-size="9.5">+ resgatarVantagem(v): ResgateVantagem</text>
    <text x="48" y="341" font-size="9.5">+ consultarExtrato(): List&lt;Transacao&gt;</text>
  </g>

  <!-- ============ Professor ============ -->
  <g>
    <rect x="310" y="225" width="210" height="110" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="310" y1="249" x2="520" y2="249" stroke="#000000" stroke-width="1"/>
    <line x1="310" y1="285" x2="520" y2="285" stroke="#000000" stroke-width="1"/>
    <text x="415" y="242" text-anchor="middle" font-size="11" font-weight="bold">Professor</text>
    <text x="318" y="263" font-size="9.5">- cpf: String</text>
    <text x="318" y="277" font-size="9.5">- departamento: String</text>
    <text x="318" y="299" font-size="9.5">+ enviarMoedas(aluno, valor, motivo):</text>
    <text x="318" y="313" font-size="9.5">   EnvioMoedas</text>
    <text x="318" y="327" font-size="9.5">+ consultarExtrato(): List&lt;Transacao&gt;</text>
  </g>

  <!-- ============ EmpresaParceira ============ -->
  <g>
    <rect x="560" y="225" width="220" height="96" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="560" y1="249" x2="780" y2="249" stroke="#000000" stroke-width="1"/>
    <line x1="560" y1="273" x2="780" y2="273" stroke="#000000" stroke-width="1"/>
    <text x="670" y="242" text-anchor="middle" font-size="11" font-weight="bold">EmpresaParceira</text>
    <text x="568" y="267" font-size="9.5">- cnpj: String</text>
    <text x="568" y="287" font-size="9.5">+ cadastrarVantagem(descricao,</text>
    <text x="568" y="301" font-size="9.5">   foto, custo): Vantagem</text>
  </g>

  <!-- ============ Instituicao ============ -->
  <g>
    <rect x="40" y="440" width="200" height="58" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="40" y1="464" x2="240" y2="464" stroke="#000000" stroke-width="1"/>
    <line x1="40" y1="488" x2="240" y2="488" stroke="#000000" stroke-width="1"/>
    <text x="140" y="457" text-anchor="middle" font-size="11" font-weight="bold">Instituicao</text>
    <text x="48" y="479" font-size="9.5">- nome: String</text>
  </g>
  <text x="140" y="512" text-anchor="middle" font-size="8.2" fill="#555555">pré-cadastrada no sistema</text>

  <!-- ============ Conta ============ -->
  <g>
    <rect x="300" y="440" width="180" height="96" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="300" y1="464" x2="480" y2="464" stroke="#000000" stroke-width="1"/>
    <line x1="300" y1="488" x2="480" y2="488" stroke="#000000" stroke-width="1"/>
    <text x="390" y="457" text-anchor="middle" font-size="11" font-weight="bold">Conta</text>
    <text x="308" y="479" font-size="9.5">- saldo: int</text>
    <text x="308" y="502" font-size="9.5">+ creditar(valor): void</text>
    <text x="308" y="516" font-size="9.5">+ debitar(valor): boolean</text>
  </g>
  <text x="390" y="550" text-anchor="middle" font-size="8.2" fill="#555555">professor recebe +1.000 moedas</text>
  <text x="390" y="560" text-anchor="middle" font-size="8.2" fill="#555555">por semestre (saldo acumulável)</text>

  <!-- ============ Transacao (abstrata) ============ -->
  <g>
    <rect x="680" y="440" width="220" height="82" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="680" y1="464" x2="900" y2="464" stroke="#000000" stroke-width="1"/>
    <line x1="680" y1="502" x2="900" y2="502" stroke="#000000" stroke-width="1"/>
    <text x="790" y="457" text-anchor="middle" font-size="11" font-weight="bold" font-style="italic">Transacao</text>
    <text x="688" y="479" font-size="9.5">- valor: int</text>
    <text x="688" y="493" font-size="9.5">- data: LocalDateTime</text>
  </g>

  <!-- ============ Vantagem ============ -->
  <g>
    <rect x="1080" y="440" width="200" height="96" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="1080" y1="464" x2="1280" y2="464" stroke="#000000" stroke-width="1"/>
    <line x1="1080" y1="516" x2="1280" y2="516" stroke="#000000" stroke-width="1"/>
    <text x="1180" y="457" text-anchor="middle" font-size="11" font-weight="bold">Vantagem</text>
    <text x="1088" y="479" font-size="9.5">- descricao: String</text>
    <text x="1088" y="493" font-size="9.5">- foto: String (caminho)</text>
    <text x="1088" y="507" font-size="9.5">- custoEmMoedas: int</text>
  </g>

  <!-- Generalização de Transacao -->
  <g stroke="#000000" stroke-width="1.2" fill="none">
    <line x1="790" y1="580" x2="790" y2="526" marker-end="url(#tri)"/>
    <line x1="675" y1="580" x2="940" y2="580"/>
    <line x1="675" y1="580" x2="675" y2="620"/>
    <line x1="940" y1="580" x2="940" y2="620"/>
  </g>

  <!-- ============ EnvioMoedas ============ -->
  <g>
    <rect x="560" y="620" width="230" height="72" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="560" y1="644" x2="790" y2="644" stroke="#000000" stroke-width="1"/>
    <line x1="560" y1="668" x2="790" y2="668" stroke="#000000" stroke-width="1"/>
    <text x="675" y="637" text-anchor="middle" font-size="11" font-weight="bold">EnvioMoedas</text>
    <text x="568" y="661" font-size="9.5">- motivo: String (obrigatório)</text>
  </g>

  <!-- ============ ResgateVantagem ============ -->
  <g>
    <rect x="820" y="620" width="240" height="72" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="820" y1="644" x2="1060" y2="644" stroke="#000000" stroke-width="1"/>
    <line x1="820" y1="668" x2="1060" y2="668" stroke="#000000" stroke-width="1"/>
    <text x="940" y="637" text-anchor="middle" font-size="11" font-weight="bold">ResgateVantagem</text>
    <text x="828" y="661" font-size="9.5">- codigoCupom: String (gerado)</text>
  </g>

  <!-- ============ ServicoEmail (interface) ============ -->
  <g>
    <rect x="1080" y="620" width="200" height="72" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <line x1="1080" y1="654" x2="1280" y2="654" stroke="#000000" stroke-width="1"/>
    <text x="1180" y="634" text-anchor="middle" font-size="9" font-style="italic">«interface»</text>
    <text x="1180" y="648" text-anchor="middle" font-size="11" font-weight="bold">ServicoEmail</text>
    <text x="1088" y="670" font-size="9.5">+ enviar(para, assunto,</text>
    <text x="1088" y="684" font-size="9.5">   corpo): void</text>
  </g>

  <!-- ============ Associações ============ -->
  <g fill="none" stroke="#000000" stroke-width="1.1">
    <!-- Instituicao 1 — 0..* Aluno -->
    <line x1="120" y1="440" x2="120" y2="349"/>
    <!-- Instituicao 1 — 0..* Professor -->
    <polyline points="330,335 330,400 200,400 200,440"/>
    <!-- Aluno 1 — 1 Conta -->
    <polyline points="230,349 230,418 345,418 345,440"/>
    <!-- Professor 1 — 1 Conta -->
    <line x1="450" y1="335" x2="450" y2="440"/>
    <!-- Professor 1 — 0..* EnvioMoedas (envia) -->
    <polyline points="490,335 490,500 620,500 620,620"/>
    <!-- Aluno 1 — 0..* EnvioMoedas (recebe) -->
    <polyline points="560,655 20,655 20,300 40,300"/>
    <!-- Aluno 1 — 0..* ResgateVantagem -->
    <polyline points="900,692 900,720 30,720 30,320 40,320"/>
    <!-- ResgateVantagem 0..* — 1 Vantagem -->
    <polyline points="1060,650 1170,650 1170,536"/>
    <!-- EmpresaParceira 1 — 0..* Vantagem (oferece) -->
    <polyline points="780,270 1170,270 1170,440"/>
  </g>

  <!-- multiplicidades e rótulos -->
  <text x="126" y="434" font-size="9">1</text>
  <text x="126" y="362" font-size="9">0..*</text>
  <text x="206" y="434" font-size="9">1</text>
  <text x="336" y="350" font-size="9">0..*</text>
  <text x="236" y="362" font-size="9">1</text>
  <text x="351" y="434" font-size="9">1</text>
  <text x="456" y="350" font-size="9">1</text>
  <text x="456" y="434" font-size="9">1</text>
  <text x="496" y="350" font-size="9">1</text>
  <text x="626" y="612" font-size="9">0..*</text>
  <text x="500" y="492" font-size="8.5" fill="#555555">envia</text>
  <text x="33" y="296" font-size="9">1</text>
  <text x="530" y="649" font-size="9">0..*</text>
  <text x="250" y="649" font-size="8.5" fill="#555555">recebe</text>
  <text x="33" y="315" font-size="9">1</text>
  <text x="864" y="716" font-size="9">0..*</text>
  <text x="250" y="714" font-size="8.5" fill="#555555">resgata</text>
  <text x="1070" y="644" font-size="9">0..*</text>
  <text x="1176" y="550" font-size="9">1</text>
  <text x="786" y="264" font-size="9">1</text>
  <text x="1176" y="434" font-size="9">0..*</text>
  <text x="980" y="264" font-size="8.5" fill="#555555">oferece</text>

  <!-- ============ Dependência «use» ============ -->
  <g fill="none" stroke="#000000" stroke-width="1.1" stroke-dasharray="6 4">
    <polyline points="900,490 1000,490 1000,560 1180,560 1180,616" marker-end="url(#open)"/>
  </g>
  <text x="1040" y="553" font-size="9" font-style="italic">«notifica por email»</text>
</svg>

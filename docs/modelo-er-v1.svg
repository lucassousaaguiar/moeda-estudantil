<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1240" height="660" fill="#ffffff"/>
  <text x="620" y="645" text-anchor="middle" font-size="11" fill="#555555">Modelo ER (lógico) v1 — Sistema de Moeda Estudantil (Lab03S02) · herança USUARIO em tabelas separadas (JOINED, PK=FK) · TRANSACAO em tabela única com coluna discriminadora "tipo"</text>

  <!-- ===== USUARIO ===== -->
  <g>
    <rect x="60" y="40" width="230" height="102" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <rect x="60" y="40" width="230" height="22" fill="#e8e8e8" stroke="#000000" stroke-width="1.3"/>
    <text x="175" y="55" text-anchor="middle" font-size="10.5" font-weight="bold">USUARIO</text>
    <text x="68" y="76" font-size="9">id (PK)</text>
    <text x="68" y="90" font-size="9">nome</text>
    <text x="68" y="104" font-size="9">email (UNIQUE)</text>
    <text x="68" y="118" font-size="9">login (UNIQUE)</text>
    <text x="68" y="132" font-size="9">senha_hash</text>
  </g>

  <!-- herança -->
  <g stroke="#000000" stroke-width="1.1" fill="none">
    <line x1="175" y1="142" x2="175" y2="185"/>
    <line x1="160" y1="185" x2="715" y2="185"/>
    <line x1="160" y1="185" x2="160" y2="220"/>
    <line x1="440" y1="185" x2="440" y2="220"/>
    <line x1="715" y1="185" x2="715" y2="220"/>
  </g>
  <text x="250" y="180" font-size="8.5" fill="#555555" font-style="italic">herança 1:1 (PK = FK)</text>

  <!-- ===== ALUNO ===== -->
  <g>
    <rect x="40" y="220" width="240" height="130" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <rect x="40" y="220" width="240" height="22" fill="#e8e8e8" stroke="#000000" stroke-width="1.3"/>
    <text x="160" y="235" text-anchor="middle" font-size="10.5" font-weight="bold">ALUNO</text>
    <text x="48" y="256" font-size="9">id (PK, FK → USUARIO)</text>
    <text x="48" y="270" font-size="9">cpf (UNIQUE)</text>
    <text x="48" y="284" font-size="9">rg</text>
    <text x="48" y="298" font-size="9">endereco</text>
    <text x="48" y="312" font-size="9">curso</text>
    <text x="48" y="326" font-size="9">instituicao_id (FK)</text>
    <text x="48" y="340" font-size="9">conta_id (FK, UNIQUE)</text>
  </g>

  <!-- ===== PROFESSOR ===== -->
  <g>
    <rect x="320" y="220" width="240" height="102" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <rect x="320" y="220" width="240" height="22" fill="#e8e8e8" stroke="#000000" stroke-width="1.3"/>
    <text x="440" y="235" text-anchor="middle" font-size="10.5" font-weight="bold">PROFESSOR</text>
    <text x="328" y="256" font-size="9">id (PK, FK → USUARIO)</text>
    <text x="328" y="270" font-size="9">cpf (UNIQUE)</text>
    <text x="328" y="284" font-size="9">departamento</text>
    <text x="328" y="298" font-size="9">instituicao_id (FK)</text>
    <text x="328" y="312" font-size="9">conta_id (FK, UNIQUE)</text>
  </g>

  <!-- ===== EMPRESA_PARCEIRA ===== -->
  <g>
    <rect x="600" y="220" width="230" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <rect x="600" y="220" width="230" height="22" fill="#e8e8e8" stroke="#000000" stroke-width="1.3"/>
    <text x="715" y="235" text-anchor="middle" font-size="10.5" font-weight="bold">EMPRESA_PARCEIRA</text>
    <text x="608" y="256" font-size="9">id (PK, FK → USUARIO)</text>
    <text x="608" y="270" font-size="9">cnpj (UNIQUE)</text>
  </g>

  <!-- ===== INSTITUICAO ===== -->
  <g>
    <rect x="40" y="480" width="220" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <rect x="40" y="480" width="220" height="22" fill="#e8e8e8" stroke="#000000" stroke-width="1.3"/>
    <text x="150" y="495" text-anchor="middle" font-size="10.5" font-weight="bold">INSTITUICAO</text>
    <text x="48" y="516" font-size="9">id (PK)</text>
    <text x="48" y="530" font-size="9">nome (UNIQUE)</text>
  </g>

  <!-- ===== CONTA ===== -->
  <g>
    <rect x="320" y="480" width="200" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <rect x="320" y="480" width="200" height="22" fill="#e8e8e8" stroke="#000000" stroke-width="1.3"/>
    <text x="420" y="495" text-anchor="middle" font-size="10.5" font-weight="bold">CONTA</text>
    <text x="328" y="516" font-size="9">id (PK)</text>
    <text x="328" y="530" font-size="9">saldo</text>
  </g>

  <!-- ===== VANTAGEM ===== -->
  <g>
    <rect x="620" y="480" width="230" height="102" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <rect x="620" y="480" width="230" height="22" fill="#e8e8e8" stroke="#000000" stroke-width="1.3"/>
    <text x="735" y="495" text-anchor="middle" font-size="10.5" font-weight="bold">VANTAGEM</text>
    <text x="628" y="516" font-size="9">id (PK)</text>
    <text x="628" y="530" font-size="9">descricao</text>
    <text x="628" y="544" font-size="9">foto</text>
    <text x="628" y="558" font-size="9">custo_em_moedas</text>
    <text x="628" y="572" font-size="9">empresa_id (FK)</text>
  </g>

  <!-- ===== TRANSACAO ===== -->
  <g>
    <rect x="920" y="220" width="260" height="158" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <rect x="920" y="220" width="260" height="22" fill="#e8e8e8" stroke="#000000" stroke-width="1.3"/>
    <text x="1050" y="235" text-anchor="middle" font-size="10.5" font-weight="bold">TRANSACAO</text>
    <text x="928" y="256" font-size="9">id (PK)</text>
    <text x="928" y="270" font-size="9">tipo (ENVIO | RESGATE)</text>
    <text x="928" y="284" font-size="9">valor</text>
    <text x="928" y="298" font-size="9">data</text>
    <text x="928" y="312" font-size="9">aluno_id (FK)</text>
    <text x="928" y="326" font-size="9">professor_id (FK, nulo em resgates)</text>
    <text x="928" y="340" font-size="9">vantagem_id (FK, nulo em envios)</text>
    <text x="928" y="354" font-size="9">motivo (nulo em resgates)</text>
    <text x="928" y="368" font-size="9">codigo_cupom (nulo em envios)</text>
  </g>

  <!-- ===== Relacionamentos ===== -->
  <g fill="none" stroke="#000000" stroke-width="1.1">
    <!-- ALUNO N — 1 INSTITUICAO -->
    <line x1="120" y1="350" x2="120" y2="480"/>
    <!-- PROFESSOR N — 1 INSTITUICAO -->
    <polyline points="360,322 360,440 150,440 150,480"/>
    <!-- ALUNO 1 — 1 CONTA -->
    <polyline points="240,350 240,460 380,460 380,480"/>
    <!-- PROFESSOR 1 — 1 CONTA -->
    <line x1="460" y1="322" x2="460" y2="480"/>
    <!-- EMPRESA 1 — N VANTAGEM -->
    <line x1="715" y1="280" x2="715" y2="480"/>
    <!-- ALUNO 1 — N TRANSACAO -->
    <polyline points="280,340 300,340 300,420 880,420 880,300 920,300"/>
    <!-- PROFESSOR 1 — N TRANSACAO -->
    <polyline points="480,220 480,205 900,205 900,250 920,250"/>
    <!-- VANTAGEM 1 — N TRANSACAO -->
    <polyline points="850,520 1050,520 1050,378"/>
  </g>

  <!-- cardinalidades -->
  <text x="126" y="364" font-size="9">N</text>
  <text x="126" y="474" font-size="9">1</text>
  <text x="366" y="336" font-size="9">N</text>
  <text x="156" y="474" font-size="9">1</text>
  <text x="246" y="364" font-size="9">1</text>
  <text x="386" y="474" font-size="9">1</text>
  <text x="466" y="336" font-size="9">1</text>
  <text x="466" y="474" font-size="9">1</text>
  <text x="721" y="296" font-size="9">1</text>
  <text x="721" y="474" font-size="9">N</text>
  <text x="286" y="334" font-size="9">1</text>
  <text x="898" y="296" font-size="9">N</text>
  <text x="486" y="216" font-size="9">1</text>
  <text x="902" y="264" font-size="9">N</text>
  <text x="856" y="514" font-size="9">1</text>
  <text x="1056" y="392" font-size="9">N</text>
  <text x="560" y="434" font-size="8.5" fill="#555555">recebimentos/trocas do aluno</text>
  <text x="640" y="200" font-size="8.5" fill="#555555">envios do professor</text>
  <text x="900" y="534" font-size="8.5" fill="#555555">resgates</text>
</svg>

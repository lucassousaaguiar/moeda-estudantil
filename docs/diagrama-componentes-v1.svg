<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="#000000" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="560" fill="#ffffff"/>
  <text x="590" y="546" text-anchor="middle" font-size="10.5" fill="#555555">Diagrama de Componentes v1 — Arquitetura MVC com Spring Boot (M = Entidades + Services + Repositories · V = Templates Thymeleaf · C = Controllers)</text>

  <!-- ===== Container: aplicação ===== -->
  <rect x="270" y="30" width="620" height="470" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="580" y="52" text-anchor="middle" font-size="12" font-weight="bold">Aplicação Web — Spring Boot (arquitetura MVC)</text>

  <!-- icone de componente (função repetida como grupos) -->
  <!-- ===== Views ===== -->
  <g>
    <rect x="310" y="80" width="190" height="64" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <rect x="478" y="86" width="14" height="18" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <rect x="474" y="89" width="8" height="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <rect x="474" y="96" width="8" height="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="398" y="110" text-anchor="middle" font-size="10.5" font-weight="bold">Views</text>
    <text x="398" y="124" text-anchor="middle" font-size="9">Templates Thymeleaf (V)</text>
  </g>

  <!-- ===== ServicoEmail ===== -->
  <g>
    <rect x="580" y="80" width="190" height="64" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <rect x="748" y="86" width="14" height="18" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <rect x="744" y="89" width="8" height="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <rect x="744" y="96" width="8" height="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="670" y="110" text-anchor="middle" font-size="10.5" font-weight="bold">Serviço de Email</text>
    <text x="670" y="124" text-anchor="middle" font-size="9">Spring Mail (JavaMailSender)</text>
  </g>

  <!-- ===== Controllers ===== -->
  <g>
    <rect x="310" y="230" width="190" height="64" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <rect x="478" y="236" width="14" height="18" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <rect x="474" y="239" width="8" height="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <rect x="474" y="246" width="8" height="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="398" y="260" text-anchor="middle" font-size="10.5" font-weight="bold">Controllers</text>
    <text x="398" y="274" text-anchor="middle" font-size="9">Spring MVC (C)</text>
  </g>

  <!-- ===== Services ===== -->
  <g>
    <rect x="580" y="230" width="190" height="64" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <rect x="748" y="236" width="14" height="18" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <rect x="744" y="239" width="8" height="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <rect x="744" y="246" width="8" height="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="670" y="260" text-anchor="middle" font-size="10.5" font-weight="bold">Services</text>
    <text x="670" y="274" text-anchor="middle" font-size="9">regras de negócio (M)</text>
  </g>

  <!-- ===== Entidades ===== -->
  <g>
    <rect x="310" y="380" width="190" height="64" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <rect x="478" y="386" width="14" height="18" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <rect x="474" y="389" width="8" height="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <rect x="474" y="396" width="8" height="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="398" y="410" text-anchor="middle" font-size="10.5" font-weight="bold">Entidades</text>
    <text x="398" y="424" text-anchor="middle" font-size="9">modelo de domínio JPA (M)</text>
  </g>

  <!-- ===== Repositories ===== -->
  <g>
    <rect x="580" y="380" width="190" height="64" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <rect x="748" y="386" width="14" height="18" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <rect x="744" y="389" width="8" height="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <rect x="744" y="396" width="8" height="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="670" y="410" text-anchor="middle" font-size="10.5" font-weight="bold">Repositories</text>
    <text x="670" y="424" text-anchor="middle" font-size="9">Spring Data JPA / Hibernate (M)</text>
  </g>

  <!-- ===== Navegador (externo) ===== -->
  <g>
    <rect x="40" y="230" width="170" height="64" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <text x="125" y="260" text-anchor="middle" font-size="10.5" font-weight="bold">Navegador</text>
    <text x="125" y="274" text-anchor="middle" font-size="9">aluno, professor, empresa</text>
  </g>

  <!-- ===== Servidor SMTP (externo) ===== -->
  <g>
    <rect x="950" y="80" width="180" height="64" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
    <text x="1040" y="106" text-anchor="middle" font-size="9" font-style="italic">«sistema externo»</text>
    <text x="1040" y="121" text-anchor="middle" font-size="10.5" font-weight="bold">Servidor SMTP</text>
  </g>

  <!-- ===== Banco de dados (externo, cilindro) ===== -->
  <g stroke="#000000" stroke-width="1.3" fill="#ffffff">
    <path d="M 950 370 L 950 440 A 90 14 0 0 0 1130 440 L 1130 370"/>
    <ellipse cx="1040" cy="370" rx="90" ry="14"/>
  </g>
  <text x="1040" y="412" text-anchor="middle" font-size="10.5" font-weight="bold">Banco de Dados</text>
  <text x="1040" y="426" text-anchor="middle" font-size="9">MySQL (dev: H2)</text>

  <!-- ===== Dependências ===== -->
  <g fill="none" stroke="#000000" stroke-width="1.1" stroke-dasharray="6 4">
    <line x1="210" y1="262" x2="306" y2="262" marker-end="url(#open)"/>
    <line x1="405" y1="226" x2="405" y2="148" marker-end="url(#open)"/>
    <line x1="504" y1="262" x2="576" y2="262" marker-end="url(#open)"/>
    <line x1="670" y1="226" x2="670" y2="148" marker-end="url(#open)"/>
    <line x1="670" y1="298" x2="670" y2="376" marker-end="url(#open)"/>
    <line x1="576" y1="412" x2="504" y2="412" marker-end="url(#open)"/>
    <line x1="580" y1="280" x2="470" y2="376" marker-end="url(#open)"/>
    <line x1="774" y1="112" x2="946" y2="112" marker-end="url(#open)"/>
    <line x1="774" y1="412" x2="946" y2="398" marker-end="url(#open)"/>
  </g>
  <text x="252" y="254" text-anchor="middle" font-size="8.5" font-style="italic">HTTP</text>
  <text x="418" y="190" font-size="8.5" font-style="italic">renderiza</text>
  <text x="540" y="254" text-anchor="middle" font-size="8.5" font-style="italic">chama</text>
  <text x="678" y="190" font-size="8.5" font-style="italic">envia emails</text>
  <text x="678" y="340" font-size="8.5" font-style="italic">consulta/grava</text>
  <text x="540" y="404" text-anchor="middle" font-size="8.5" font-style="italic">mapeia</text>
  <text x="494" y="330" font-size="8.5" font-style="italic">usa</text>
  <text x="858" y="104" text-anchor="middle" font-size="8.5" font-style="italic">SMTP</text>
  <text x="858" y="398" text-anchor="middle" font-size="8.5" font-style="italic">JDBC</text>
</svg>
